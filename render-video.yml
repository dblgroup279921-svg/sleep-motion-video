name: Render Remotion Video

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip sleep-video.zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Install Chrome (Required for Remotion)
        run: npx remotion browser ensure

      - name: Render Video
        run: npm run render

      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4
